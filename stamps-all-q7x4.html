<style>
  body { font-family: sans-serif; margin: 0; background: #fdf6f8; color: #333; }
  header { background: #ff5c8a; color: #fff; padding: 13px 16px; font-size: 19px; font-weight: bold; }
  .pick { padding: 12px; }
  .pick label { font-size: 14px; font-weight: bold; color: #b03060; display: block; margin-bottom: 6px; }
  .pick select { width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border: 2px solid #ff5c8a; border-radius: 10px; background: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 12px 18px; }
  .btn { background: #fff; border: 2px solid #ffc2d4; border-radius: 12px; padding: 13px 8px;
         font-size: 15px; font-weight: bold; text-align: center; color: #333; }
  .btn:active { background: #ffe3ec; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 10; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 14px; }
  .sheet .phrase { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .sheet video { width: 100%; max-height: 52vh; border-radius: 8px; background: #000; }
  .send { display: block; width: 100%; margin-top: 10px; padding: 14px; font-size: 17px; font-weight: bold;
          color: #fff; background: linear-gradient(180deg, #ff7ba3, #ff5c8a); border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(255,92,138,.35); }
  .close { display: block; width: 100%; margin-top: 8px; padding: 11px; font-size: 15px;
           background: #eee; border: none; border-radius: 10px; }
  body.night { background: #14100e; color: #f3e9d2; }
  body.night header { background: #1f1a16; color: #e8cf8f; border-bottom: 2px solid #c9a86a; }
  body.night .pick label { color: #c9a86a; }

  body.night .btn:active { background: #3a2c1c; }
  body.night .sheet { background: #1f1a16; }
  body.night .close { background: #2c241c; color: #f3e9d2; }

  body.male .send { background: linear-gradient(180deg, #5b93e6, #3a7bd5); box-shadow: 0 2px 8px rgba(58,123,213,.35); }
  body.dog .send { background: linear-gradient(180deg, #ffb066, #ff9f43); box-shadow: 0 2px 8px rgba(255,159,67,.35); }
  body.male { background: #f4f8fd; }
  body.male header { background: #3a7bd5; }
  body.male .pick label { color: #2a5da8; }
  body.male .pick select { border-color: #3a7bd5; }
  body.male .btn { border-color: #a8c8ec; }

  body.dog { background: #fffaf3; }

  body.dog .pick label { color: #b96a12; }

  function render(idx) {
    document.body.className = THEMES[idx] === "day" ? "" : THEMES[idx];
    grid.innerHTML = '';

      var b = document.createElement('button');
      b.className = 'btn';
      b.textContent = it[1];
      b.addEventListener('click', function() { openSheet(it); });
      grid.appendChild(b);

  function openSheet(it) {

    shVideo.play().catch(function() {});
  }
  function closeSheet() {
    shVideo.pause();

    var phrase = current[1];
